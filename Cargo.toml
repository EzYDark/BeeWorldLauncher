[package]
name = "beeworld-launcher"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "BeeWorldLauncher"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = false
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
